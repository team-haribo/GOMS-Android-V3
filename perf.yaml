# 성능 측정/판정 설정. 자세한 근거는 perfkit 문서(docs/DESIGN.md) 참고.
repeats: 3

# 같은 device_profile 끼리만 비교한다. 러너/에뮬레이터를 바꾸면 값을 바꾸고
# baseline 도 새로 뜬다 (다른 하드웨어의 절대값 비교는 무의미).
device_profile: ci-emulator-api34

# GOMS 실제 화면에 맞춘 시나리오. perfkit 기본 템플릿(community/gallery 등)은
# 이 앱에 없는 화면이라 실제 화면(로그인, 홈, 외출 현황, 멤버 목록) 기준으로 다시 짰다.
scenarios:
  - app_startup
  - login
  - home_scroll
  - outing_state_scroll
  - member_list_scroll

# 판정: |상대변화| > change_percent  AND  |Δ| > sigma*노이즈  AND  |Δ| > min_abs_delta
# 셋을 모두 넘어야 FAIL. min_abs_delta 는 "사람이 체감 못 하는 변화" 하한선.
sigma: 2.0

thresholds:
  default:           { change_percent: 15, min_abs_delta: 0 }
  fps:               { change_percent: 10, min_abs_delta: 1.0 }
  # 아래 min_abs_delta 는 "체감 하한"이 아니라 CI 에뮬레이터의 실행 간 편차 하한이다.
  # perfkit 의 노이즈(sigma 게이트)는 한 실행 안의 반복 3회로만 추정해서, 에뮬레이터
  # 부팅마다 달라지는 편차를 못 잡는다. 같은 코드의 CI 8회에서 가끔 실행 전체가 느려져
  # 스크롤 p95 가 +7.8ms, jank 가 +14.9%p, dropped_frames 가 +16 까지 튀었다.
  # 그 이하의 변화는 이 환경에서 코드 탓인지 구분할 수 없으므로 실패로 보지 않는다. (#148)
  jank_rate:         { change_percent: 20, min_abs_delta: 15.0 }
  dropped_frames:    { change_percent: 25, min_abs_delta: 17 }
  p50_frame_time_ms: { change_percent: 20, min_abs_delta: 1.5 }
  p90_frame_time_ms: { change_percent: 15, min_abs_delta: 7.5 }
  p95_frame_time_ms: { change_percent: 15, min_abs_delta: 8.5 }
  p99_frame_time_ms: { change_percent: 20, min_abs_delta: 9.5 }
  memory_mb:         { change_percent: 20, min_abs_delta: 12.0 }
  startup_ms:            { change_percent: 20, min_abs_delta: 150 }
  startup_rasterized_ms: { change_percent: 20, min_abs_delta: 150 }
  # login 은 실제 백엔드 응답을 기다리므로 네트워크 편차(+640ms)가 그대로 섞인다.
  duration_ms:       { change_percent: 25, min_abs_delta: 700 }

# 리포트/대시보드에서 앞에 보여줄 지표. 나머지는 접어둔다.
headline_metrics: [fps, jank_rate, p95_frame_time_ms, memory_mb, startup_ms]

# baseline 이 이보다 오래되면 리포트에 경고를 띄운다.
baseline_max_age_days: 30

# PR 에서 변경된 파일과 겹치는 시나리오만 측정한다 (perfkit select).
# 여기 없는 경로(lib/core, main.dart, pubspec, android/, integration_test/ 등 공통·빌드
# 변경)가 하나라도 바뀌면 안전하게 전체를 측정한다.
selection:
  ignore: ["**/*.md", "docs/**"]
  scenarios:
    app_startup: ["lib/features/splash/**"]
    login: ["lib/features/auth/**", "lib/features/splash/**"]
    # 홈(home_list)은 outing 의 대기 화면이다.
    home_scroll: ["lib/features/outing/**"]
    outing_state_scroll: ["lib/features/outing/**"]
    member_list_scroll: ["lib/features/member/**"]
